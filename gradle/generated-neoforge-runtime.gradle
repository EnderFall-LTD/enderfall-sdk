    '26.2-neoforge': [
        minecraftVersion: '26.2', javaVersion: 25, loader: 'neoforge',
        loaderVersion: '26.2.0.75', platformApiVersion: '',
        referenceProjectPath: ':runtime-neoforge-26.2', referenceLayout: 'inherited-1.21.4',
        inheritedReferenceJavaFiles: ['EnderfallNeoForgeRuntime', 'NeoForgeConsumerBootstrap', 'NeoForgeRawPayload']
            .collect { 'uk/co/enderfall/sdk/runtime/neoforge/v1_21_4/' + it + '.java' },
        localReferenceJavaFiles: ['ClientHooks', 'CommandBridge', 'PlatformAdapter', 'PlatformInfo',
            'PortableMenuScreen', 'WorkbenchBinding', 'WorkbenchMenu', 'WorkbenchRecipe', 'WorkbenchScreen']
