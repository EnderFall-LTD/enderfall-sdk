name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify SDK
        run: ./gradlew checkAll releaseChecksums cyclonedxBom
        if: runner.os != 'Windows'
      - name: Verify SDK on Windows
        run: .\gradlew.bat checkAll releaseChecksums cyclonedxBom
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ runner.os }}
          path: |
            build/checksums/SHA256SUMS
            build/reports/cyclonedx/bom.*
          if-no-files-found: error

  server-smoke:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.20.1-neoforge
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 1.21.4-fabric
          - 1.21.4-neoforge
          - 26.2-fabric
          - 26.2-neoforge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Smoke test ${{ matrix.target }} dedicated server
        run: ./gradlew serverSmoke -Penderfall.smokeTarget=${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: server-smoke-${{ matrix.target }}
          path: build/reports/runtime-smoke
          if-no-files-found: error

  client-smoke:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.20.1-neoforge
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 1.21.4-fabric
          - 1.21.4-neoforge
          - 26.2-fabric
          - 26.2-neoforge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Smoke test ${{ matrix.target }} client
        run: xvfb-run -a ./gradlew clientSmoke "-Penderfall.smokeTarget=${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: client-smoke-${{ matrix.target }}
          path: build/reports/runtime-smoke
          if-no-files-found: error

  same-loader-smoke:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.20.1-neoforge
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 1.21.4-fabric
          - 1.21.4-neoforge
          - 26.2-fabric
          - 26.2-neoforge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Connect ${{ matrix.target }} client and server
        run: xvfb-run -a ./gradlew sameLoaderSmoke "-Penderfall.smokeTarget=${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: same-loader-smoke-${{ matrix.target }}
          path: build/reports/runtime-smoke
          if-no-files-found: error
