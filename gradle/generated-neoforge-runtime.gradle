        platformApiVersion: '',
        referenceProjectPath: ':runtime-neoforge-1.21.1',
        referenceLayout: 'inherited-1.21.4',
        inheritedReferenceJavaFiles: inherited1214JavaFilesFor1211,
        localReferenceJavaFiles: local1211JavaFiles,
        suppressAuxiliaryClassWarning: true
    ],
    '1.21.4-neoforge': [
        minecraftVersion: '1.21.4',
        javaVersion: 21,
        loader: 'neoforge',
        loaderVersion: '21.4.157',
        platformApiVersion: '',
        referenceProjectPath: ':runtime-neoforge-1.21.4',
        referenceLayout: 'direct',
        inheritedReferenceJavaFiles: [],
        localReferenceJavaFiles: [],
        suppressAuxiliaryClassWarning: false
    ]
