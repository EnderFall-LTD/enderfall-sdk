name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact coordinated SDK version
        required: true
        type: string
      manual_acceptance:
        description: I completed the documented launcher, dedicated-server, and GUI-scale release-candidate checks
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: enderfall-sdk-publication
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify SDK and fresh consumer builds
        if: runner.os != 'Windows'
        run: ./gradlew checkAll checkContractTargets checkDemoMod releaseChecksums cyclonedxBom
      - name: Verify SDK and fresh consumer builds on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat checkAll checkContractTargets checkDemoMod releaseChecksums cyclonedxBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build-${{ runner.os }}
          path: |
            build/checksums/SHA256SUMS
            build/reports/cyclonedx/bom.*
          if-no-files-found: error

  runtime-acceptance:
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.20.1-neoforge
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 1.21.4-fabric
          - 1.21.4-neoforge
          - 26.2-fabric
          - 26.2-neoforge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Resolve pinned build plugins
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew help; then exit 0; fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 10))
          done
      - name: Dedicated-server acceptance
        run: ./gradlew generatedBridgeServerSmoke "-Penderfall.smokeTarget=${{ matrix.target }}"
      - name: Client and portable UI acceptance
        run: xvfb-run -a ./gradlew generatedBridgeClientSmoke "-Penderfall.smokeTarget=${{ matrix.target }}"
      - name: Connected foundation gameplay acceptance
        run: xvfb-run -a ./gradlew generatedBridgeGameplaySmoke "-Penderfall.smokeTarget=${{ matrix.target }}"
      - name: Stage immutable evidence
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          root="build/release-evidence/${TARGET}"
          mkdir -p "$root/server" "$root/client" "$root/gameplay"
          cp build/reports/generated-bridge-runtime-smoke/server.json "$root/server/"
          cp -R build/reports/generated-bridge-runtime-smoke/server "$root/server/"
          cp build/reports/generated-bridge-runtime-smoke/client.json "$root/client/"
          cp -R build/reports/generated-bridge-runtime-smoke/client "$root/client/"
          cp build/reports/generated-bridge-gameplay/connection.json "$root/gameplay/"
          cp -R build/reports/generated-bridge-gameplay/connection "$root/gameplay/"
          printf '%s\n' "$GITHUB_SHA" > "$root/revision.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: acceptance-${{ matrix.target }}
          path: build/release-evidence/${{ matrix.target }}
          if-no-files-found: error

  starter-template:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: enderfall-sdk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: EnderFall-LTD/enderfall-sdk-template
          path: enderfall-sdk-template
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Publish candidate SDK for the starter
        if: runner.os != 'Windows'
        run: ./enderfall-sdk/gradlew -p enderfall-sdk publishWorkspace
      - name: Publish candidate SDK for the starter on Windows
        if: runner.os == 'Windows'
        run: .\enderfall-sdk\gradlew.bat -p enderfall-sdk publishWorkspace
      - name: Isolate the starter from SDK sources
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p consumer/enderfall-sdk/build
          cp -R enderfall-sdk/build/repository consumer/enderfall-sdk/build/
          mv enderfall-sdk-template consumer/enderfall-sdk-template
      - name: Isolate the starter from SDK sources on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force consumer/enderfall-sdk/build | Out-Null
          Copy-Item -Recurse enderfall-sdk/build/repository consumer/enderfall-sdk/build/repository
          Move-Item enderfall-sdk-template consumer/enderfall-sdk-template
      - name: Build a fresh starter on all targets
        if: runner.os != 'Windows'
        run: ./consumer/enderfall-sdk-template/gradlew -p consumer/enderfall-sdk-template buildAll
      - name: Build a fresh starter on all targets on Windows
        if: runner.os == 'Windows'
        run: .\consumer\enderfall-sdk-template\gradlew.bat -p consumer/enderfall-sdk-template buildAll

  release-matrix:
    needs: [verify, runtime-acceptance, starter-template]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: acceptance-*
          path: build/release-evidence
      - name: Audit exact-revision release matrix
        run: >-
          ./gradlew verifyRuntimeMatrix
          -Penderfall.releaseEvidenceRoot=build/release-evidence
          -Penderfall.releaseRevision=${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-matrix
          path: build/reports/release-matrix/matrix.json
          if-no-files-found: error

  reproducibility:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build-Linux
          path: build/reproducibility/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build-Windows
          path: build/reproducibility/windows
      - name: Compare Windows and Linux release archives
        shell: bash
        run: diff -u build/reproducibility/linux/SHA256SUMS build/reproducibility/windows/SHA256SUMS

  release:
    needs: [release-matrix, reproducibility]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify coordinated version
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(sed -n 's/^sdkVersion=//p' gradle.properties)" = "${{ inputs.version }}"
          test "$(sed -n 's/^sdkVersion=//p' gradle-plugin/gradle.properties)" = "${{ inputs.version }}"
          [[ "${{ inputs.version }}" =~ ^[0-9A-Za-z][0-9A-Za-z.-]+$ ]]
          test "${{ inputs.manual_acceptance }}" = "true"
      - name: Reject an already-published immutable version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Git tag v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi
          central_pom="https://repo1.maven.org/maven2/uk/co/enderfall/sdk/enderfall-sdk-api/${RELEASE_VERSION}/enderfall-sdk-api-${RELEASE_VERSION}.pom"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --head "$central_pom")"
          case "$status" in
            404) ;;
            200) echo "Maven Central version ${RELEASE_VERSION} already exists" >&2; exit 1 ;;
            *) echo "Could not establish Maven Central version availability (HTTP ${status})" >&2; exit 1 ;;
          esac
      - name: Rebuild coordinated release artifacts
        run: ./gradlew checkAll releaseChecksums cyclonedxBom
      - name: Verify release credentials are configured
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY_BASE64: ${{ secrets.MAVEN_SIGNING_KEY_BASE64 }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_SIGNING_KEY_BASE64 \
            MAVEN_SIGNING_PASSWORD GRADLE_PUBLISH_KEY GRADLE_PUBLISH_SECRET; do
            test -n "${!name:-}" || { echo "Missing protected release secret: $name" >&2; exit 1; }
          done
      - name: Assemble signed Maven Central bundle
        shell: bash
        env:
          MAVEN_SIGNING_KEY_BASE64: ${{ secrets.MAVEN_SIGNING_KEY_BASE64 }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          MAVEN_SIGNING_KEY="$(printf '%s' "$MAVEN_SIGNING_KEY_BASE64" | base64 --decode)"
          [[ "$MAVEN_SIGNING_KEY" == '-----BEGIN PGP PRIVATE KEY BLOCK-----'* ]]
          [[ "$MAVEN_SIGNING_KEY" == *'-----END PGP PRIVATE KEY BLOCK-----' ]]
          export MAVEN_SIGNING_KEY
          ./gradlew centralBundle --no-configuration-cache
      - name: Validate Gradle Plugin Portal publication
        run: ./gradlew -p gradle-plugin publishPlugins --validate-only
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      - name: Publish Maven bundle and wait for Central
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bundle="build/central/enderfall-sdk-${RELEASE_VERSION}-central.zip"
          test -f "$bundle"
          authorization="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          deployment_id="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            --form "bundle=@${bundle};type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=EnderFall%20SDK%20${RELEASE_VERSION}&publishingType=AUTOMATIC")"
          deployment_id="$(printf '%s' "$deployment_id" | tr -d '\r\n')"
          [[ "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "Central deployment: $deployment_id"
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $authorization" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}")"
            state="$(python -c 'import json,sys; print(json.load(sys.stdin)["deploymentState"])' <<<"$response")"
            echo "Central state: $state"
            case "$state" in
              PUBLISHED) break ;;
              FAILED) echo "$response" >&2; exit 1 ;;
            esac
            if [ "$attempt" -eq 90 ]; then
              echo "Timed out waiting for Maven Central deployment $deployment_id" >&2
              exit 1
            fi
            sleep 20
          done
      - name: Publish Gradle plugin
        run: ./gradlew -p gradle-plugin publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "**/build/libs/*.jar"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-matrix
          path: build/release-matrix
      - name: Assemble GitHub release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          cp build/checksums/SHA256SUMS build/release-assets/
          cp build/reports/cyclonedx/bom.json build/release-assets/enderfall-sdk-${RELEASE_VERSION}-sbom.json
          cp build/reports/cyclonedx/bom.xml build/release-assets/enderfall-sdk-${RELEASE_VERSION}-sbom.xml
          cp build/release-matrix/matrix.json build/release-assets/runtime-acceptance-${RELEASE_VERSION}.json
          cp docs/migrations/0.1.md build/release-assets/migration-notes-${RELEASE_VERSION}.md
          find runtime-generated-* -path '*/build/libs/*.jar' -type f \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-plain.jar' \
            -exec cp {} build/release-assets/ \;
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          prerelease_args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "v${RELEASE_VERSION}" build/release-assets/* \
            --target "$GITHUB_SHA" \
            --title "EnderFall SDK ${RELEASE_VERSION}" \
            --generate-notes \
            "${prerelease_args[@]}"
