site_name: EnderFall SDK
site_url: https://sdk.enderfall.co.uk
repo_url: https://github.com/EnderFall/enderfall-sdk
repo_name: EnderFall/enderfall-sdk
copyright: Copyright 2026 EnderFall

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Quick start: quick-start.md
  - Architecture: architecture.md
  - Compatibility: compatibility.md
  - Portable API: portable-api.md
  - Source boundaries: source-boundaries.md
  - Configuration: configuration.md
  - Networking: networking.md
  - Targets: targets.md
  - Testing and releases: testing-and-releases.md
  - Publishing: publishing.md
  - Migration notes:
      - 0.1 baseline: migrations/0.1.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
