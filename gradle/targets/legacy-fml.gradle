plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'net.neoforged.moddev.legacyforge' version '2.0.146'
}

def coordinate = project.name.substring('runtime-generated-'.length()).split('-', 2)
ext.enderfallGeneratedLegacyFmlTarget = coordinate[1] + '-' + coordinate[0]
apply from: rootProject.file('gradle/generated-legacy-fml-runtime.gradle')
