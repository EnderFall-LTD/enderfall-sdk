name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact coordinated SDK version
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify coordinated version
        shell: bash
        run: |
          test "$(sed -n 's/^sdkVersion=//p' gradle.properties)" = "${{ inputs.version }}"
          test "$(sed -n 's/^sdkVersion=//p' gradle-plugin/gradle.properties)" = "${{ inputs.version }}"
          [[ "${{ inputs.version }}" =~ ^[0-9A-Za-z][0-9A-Za-z.-]+$ ]]
      - name: Enforce all compile and real runtime gates
        run: ./gradlew checkAll verifyRuntimeMatrix releaseChecksums cyclonedxBom
      - name: Verify release credentials are configured
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY_BASE64: ${{ secrets.MAVEN_SIGNING_KEY_BASE64 }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_SIGNING_KEY_BASE64 \
            MAVEN_SIGNING_PASSWORD GRADLE_PUBLISH_KEY GRADLE_PUBLISH_SECRET; do
            test -n "${!name:-}" || { echo "Missing protected release secret: $name" >&2; exit 1; }
          done
      - name: Assemble signed Maven Central bundle
        shell: bash
        env:
          MAVEN_SIGNING_KEY_BASE64: ${{ secrets.MAVEN_SIGNING_KEY_BASE64 }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          MAVEN_SIGNING_KEY="$(printf '%s' "$MAVEN_SIGNING_KEY_BASE64" | base64 --decode)"
          [[ "$MAVEN_SIGNING_KEY" == '-----BEGIN PGP PRIVATE KEY BLOCK-----'* ]]
          [[ "$MAVEN_SIGNING_KEY" == *'-----END PGP PRIVATE KEY BLOCK-----' ]]
          export MAVEN_SIGNING_KEY
          ./gradlew centralBundle --no-configuration-cache
      - name: Validate Gradle Plugin Portal publication
        run: ./gradlew -p gradle-plugin publishPlugins --validate-only
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      - name: Publish Maven bundle and wait for Central
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bundle="build/central/enderfall-sdk-${RELEASE_VERSION}-central.zip"
          test -f "$bundle"
          authorization="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          deployment_id="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            --form "bundle=@${bundle};type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=EnderFall%20SDK%20${RELEASE_VERSION}&publishingType=AUTOMATIC")"
          deployment_id="$(printf '%s' "$deployment_id" | tr -d '\r\n')"
          [[ "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "Central deployment: $deployment_id"
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $authorization" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}")"
            state="$(python -c 'import json,sys; print(json.load(sys.stdin)["deploymentState"])' <<<"$response")"
            echo "Central state: $state"
            case "$state" in
              PUBLISHED) break ;;
              FAILED) echo "$response" >&2; exit 1 ;;
            esac
            if [ "$attempt" -eq 90 ]; then
              echo "Timed out waiting for Maven Central deployment $deployment_id" >&2
              exit 1
            fi
            sleep 20
          done
      - name: Publish Gradle plugin
        run: ./gradlew -p gradle-plugin publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "**/build/libs/*.jar"
      - name: Assemble GitHub release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          cp build/checksums/SHA256SUMS build/release-assets/
          cp build/reports/cyclonedx/bom.json build/release-assets/enderfall-sdk-${RELEASE_VERSION}-sbom.json
          cp build/reports/cyclonedx/bom.xml build/release-assets/enderfall-sdk-${RELEASE_VERSION}-sbom.xml
          cp docs/migrations/0.1.md build/release-assets/migration-notes-${RELEASE_VERSION}.md
          find runtime-generated-* -path '*/build/libs/*.jar' -type f \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-plain.jar' \
            -exec cp {} build/release-assets/ \;
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          prerelease_args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "v${RELEASE_VERSION}" build/release-assets/* \
            --target "$GITHUB_SHA" \
            --title "EnderFall SDK ${RELEASE_VERSION}" \
            --generate-notes \
            "${prerelease_args[@]}"
