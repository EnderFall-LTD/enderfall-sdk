name: publication-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify protected credentials are configured
        shell: bash
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          for name in MAVEN_SIGNING_KEY MAVEN_SIGNING_PASSWORD GRADLE_PUBLISH_KEY GRADLE_PUBLISH_SECRET; do
            test -n "${!name:-}" || { echo "Missing protected release secret: $name" >&2; exit 1; }
          done
      - name: Resolve pinned build plugins
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew help; then
              exit 0
            fi
            test "$attempt" -lt 3 || exit 1
            echo "Build plugin resolution failed; retrying attempt $((attempt + 1)) of 3" >&2
            sleep $((attempt * 10))
          done
      - name: Assemble signed Maven Central bundle
        run: ./gradlew centralBundle --no-configuration-cache
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      - name: Validate Gradle Plugin Portal publication
        run: ./gradlew -p gradle-plugin publishPlugins --validate-only
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
